[package]
name = "app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "app"
path = "src/bin/main.rs"

[workspace] # sub project that consists of this main project. workspace setting is usually used only in main project's cargo.toml.
members = [
    # "adapter",
    "db-schema"
]

[workspace.dependencies] # sharable dependencies in the workspace. This setting is usually used only in main project's cargo.toml.
db-schema = { path = "./db-schema" }
actix-web = "4.10.2"
# 構造体をGraphqlで返すために使用
# レスポンスに使う構造体定義に、OutputType traitを使う
async-graphql = "7.0.16"
async-graphql-actix-web = "=7.0.16"
chrono = { version = "0.4.40", default-features = false, features = ["serde", "clock"] }
# Dieselで NaiveDateTime を使うには、diesel の features に chrono を追加する
# https://docs.diesel.rs/master/chrono/index.html
# model定義の際、日時系カラムを持つmodelのSelectable実装にchronoが必要
diesel = { version = "2.2.9", features = ["postgres", "chrono"] }
# build libpq and openssl as part of the build process
# uncomment these lines if you run into setup issues
# pq-sys = { version = "0.6", features = ["bundled"] }
# openssl-sys = { version = "0.9.100", features = ["vendored"] }
dotenvy = "0.15.7"

[dependencies] # dependencies of this main project. Sub project's dependencies are written in sub project's cargo.toml.
db-schema = { workspace = true }
actix-web.workspace = true
async-graphql.workspace = true
async-graphql-actix-web.workspace = true
chrono.workspace = true
diesel.workspace = true
dotenvy.workspace = true
